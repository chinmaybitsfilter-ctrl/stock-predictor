name: Daily prediction

on:
  schedule:
    # 11:45 UTC = 5:15 PM IST, Monday–Friday (after NSE closes at 3:30 PM IST)
    - cron: "45 11 * * 1-5"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predictor
        run: python predictor/predict.py

      - name: Commit new predictions
        run: |
          git config user.name "prediction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Predictions for $(python -c "import json;print(json.load(open('docs/data/latest.json'))['prediction_for'])")"
            git push
          fi
